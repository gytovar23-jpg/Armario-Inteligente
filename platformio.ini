; Armário Inteligente de Notebooks — TDE Performance em Sistemas Ciberfísicos
;
; espressif32@8.0.0 traz o core Arduino 3.3.x (ESP-IDF 5.x), exigido pelo projeto.
; A biblioteca web foi transferida de mathieucarbou para a organização ESP32Async;
; é o mesmo fork mantido, apenas com novo dono no registro do PlatformIO.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_build.f_cpu = 240000000L
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_compat_mode = strict
lib_deps =
    adafruit/Adafruit PN532@1.3.4
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.12.1
    bblanchon/ArduinoJson@^7.4.2
    esp32async/AsyncTCP@3.5.0
    esp32async/ESPAsyncWebServer@3.12.1
build_flags =
    -Wall
    ; O prompt fixa AsyncTCP no core 0, junto com o restante da comunicação.
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=64
    ; Limita clientes simultâneos: sem PSRAM, cada conexão consome heap escasso.
    -DWS_MAX_QUEUED_MESSAGES=8
    ; Recursos do ArduinoJson sem uso aqui: cada um pesa em todo template instanciado.
    -DARDUINOJSON_ENABLE_STD_STRING=0
    -DARDUINOJSON_ENABLE_STD_STREAM=0
    -DARDUINOJSON_ENABLE_PROGMEM=0
    -DARDUINOJSON_ENABLE_COMMENTS=0
    -DARDUINOJSON_DECODE_UNICODE=0
    -DARDUINOJSON_USE_LONG_LONG=0
    -DARDUINOJSON_USE_DOUBLE=0
    -DASYNC_MSG_PACK_SUPPORT=0
; Demonstração: grava 24 h de histórico fictício no primeiro boot (src/dev/simulate_24h.cpp).
[env:esp32dev-sim]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DSIMULATE_24H
    -DSIM_EPOCH=$UNIX_TIME

; A lógica pura é compilada sem Arduino nem FreeRTOS, para rodar no PC.
; Requer um compilador local (gcc).
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = -std=gnu++17 -Iinclude -Isrc -DUNIT_TEST
build_src_filter =
    -<*>
    +<core/state_machine.cpp>
    +<core/usage_stats.cpp>
    +<storage/aggregator.cpp>
    +<storage/settings_model.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
